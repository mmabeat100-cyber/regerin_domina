name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm's dependency resolver hits a known bug (npm/cli#6763) on this
      # project's peer dep graph without a committed lockfile for npm.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          # Supabase anon/publishable keys are safe to expose client-side by design.
          VITE_SUPABASE_URL: https://qwvumflisbdayxiafycu.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dxyKfVTvnN6sjS3V7dv7Ng_LdYrwA3C
          VITE_SUPABASE_PROJECT_ID: qwvumflisbdayxiafycu

      - name: Prepare static output for GitHub Pages
        run: |
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html
          touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
